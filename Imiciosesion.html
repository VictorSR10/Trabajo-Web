<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de sesión con jQuery</title>
    
    <script src="https://jquery.com"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .login-box h2 {
            margin-bottom: 20px;
            color: #333333;
            text-align: center;
        }
        .textbox {
            margin-bottom: 15px;
        }
        .textbox label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        .textbox input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        #mensaje {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Iniciar Sesión</h2>
    <form id="formLogin">
        <div class="textbox">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" required>
        </div>
        <div class="textbox">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required>
        </div>
        <button type="button" id="btnEnviar" class="btn">Entrar</button>
    </form>
    <div id="mensaje"></div>
</div>

<script>
    $(document).ready(function() {
        $('#btnEnviar').click(function() {
            var usuario = $('#usuario').val().trim();
            var password = $('#password').val().trim();

            
            if (usuario === '' || password === '') {
                $('#mensaje').text('Por favor, completa todos los campos.').removeClass('success').addClass('error');
            } else if (usuario === 'admin' && password === '12345') {
                $('#mensaje').text('¡Inicio de sesión exitoso!').removeClass('error').addClass('success');
            } else {
                $('#mensaje').text('Usuario o contraseña incorrectos.').removeClass('success').addClass('error');
            }
        });
    });
</script>

</body>
</html>
