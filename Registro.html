<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Registro</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .registro-contenedor {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333333;
            text-align: center;
        }
        .grupo-control {
            margin-bottom: 15px;
        }
        .grupo-control label {
            display: block;
            margin-bottom: 5px;
            color: #666666;
        }
        .grupo-control input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .grupo-control input:focus {
            border-color: #4caf50;
            outline: none;
        }
        .error-mensaje {
            color: #de3d3d;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        .btn-registro {
            width: 100%;
            padding: 12px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-registro:hover {
            background-color: #45a049;
        }
        .exito-mensaje {
            color: #4caf50;
            text-align: center;
            font-weight: bold;
            display: none;
            margin-top: 15px;
        }
    </style>
  
    <script src="https://jquery.com"></script>
</head>
<body>

<div class="registro-contenedor">
    <h2>Crear Cuenta</h2>
    <form id="formRegistro">
        <div class="grupo-control">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre">
            <div id="errorNombre" class="error-mensaje">Por favor, introduce tu nombre.</div>
        </div>

        <div class="grupo-control">
            <label for="correo">Correo Electrónico</label>
            <input type="email" id="correo" name="correo">
            <div id="errorCorreo" class="error-mensaje">Introduce un correo electrónico válido.</div>
        </div>

        <div class="grupo-control">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password">
            <div id="errorPassword" class="error-mensaje">La contraseña debe tener al menos 6 caracteres.</div>
        </div>

        <button type="submit" class="btn-registro">Registrarse</button>
    </form>
    
    <div id="mensajeExito" class="exito-mensaje">¡Registro completado con éxito!</div>
</div>

<script>
$(document).ready(function() {
    $('#formRegistro').on('submit', function(e) {
       
        e.preventDefault(); 
        
       
        $('.error-mensaje').hide();
        $('#mensajeExito').hide();
        let esValido = true;

        
        const nombre = $('#nombre').val().trim();
        if (nombre === '') {
            $('#errorNombre').fadeIn();
            esValido = false;
        }

       
        const correo = $('#correo').val().trim();
        const expresionCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!expresionCorreo.test(correo)) {
            $('#errorCorreo').fadeIn();
            esValido = false;
        }

       
        const password = $('#password').val();
        if (password.length < 6) {
            $('#errorPassword').fadeIn();
            esValido = false;
        }

      
        if (esValido) {
            $('#mensajeExito').fadeIn();
            
            $('#formRegistro')[0].reset();
        }
    });
});
</script>

</body>
</html>
